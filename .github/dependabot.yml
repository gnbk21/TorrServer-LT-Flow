version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    target-branch: develop
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    target-branch: develop
    groups:
      frontend: {patterns: ['*']}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
