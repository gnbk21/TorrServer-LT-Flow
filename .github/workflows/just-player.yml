name: optional-flow-player
on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'build/just-player/**'
      - 'build/prepare_just_player.py'
      - 'build/player_patch_check.py'
      - 'build/player_sbom.py'
      - 'build/validate_sbom*'
      - 'build/schema/**'
      - 'web/package.json'
      - 'web/yarn.lock'
      - '.github/workflows/just-player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - working-directory: web
        run: yarn install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: moneytoo/Player
          ref: aa85148f6ccbfdf931fe207bb75ec77c478d8eb0
          path: _player
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Apply reviewed patch and test device memory policy
        run: |
          python3 build/prepare_just_player.py _player
          python3 build/player_patch_check.py _player
          mkdir -p _out/player-policy
          javac -d _out/player-policy build/just-player/FlowBufferBudget.java build/just-player/FlowBufferBudgetTest.java
          java -cp _out/player-policy com.brouken.player.FlowBufferBudgetTest
      - name: Build separate experimental app
        working-directory: _player
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          chmod +x gradlew
          ./gradlew --no-daemon assembleLatestUniversalDebug
          ./gradlew --no-daemon --no-configuration-cache --init-script ../build/just-player/inventory.gradle :app:flowInventory
      - name: Preserve source and license
        run: |
          mkdir -p _out/player-source
          git -C _player archive --format=tar HEAD > _out/player-source/upstream.tar
          cp -r build/just-player _out/player-source/flow-patch
          cp build/prepare_just_player.py _out/player-source/
          cp build/player_patch_check.py _out/player-source/
          python3 build/player_sbom.py _player/flow-resolved-dependencies.json _out/player-source/SBOM.cdx.json
          cp _player/LICENSE _out/player-source/UPSTREAM_LICENSE.txt
          sha256sum _player/app/build/outputs/apk/latestUniversal/debug/*.apk > _out/player-source/SHA256SUMS.txt
      - name: Validate exact resolved Android CycloneDX inventory
        run: node build/validate_sbom.cjs _out/player-source/SBOM.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Player-experimental
          path: |
            _player/app/build/outputs/apk/latestUniversal/debug/*.apk
            _out/player-source/**
          if-no-files-found: error
