name: Publish verified runtime container
on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Published release channel
        type: choice
        options: [stable, preview]
        required: true
      artifact_run_id:
        description: Successful tagged release run that produced these binaries
        type: string
        required: true
      source_ref:
        description: Exact published 40-character source commit
        type: string
        required: true
      version:
        description: Published Flow release tag
        type: string
        required: true
  workflow_call:
    inputs:
      release_channel:
        type: string
        required: true
      artifact_run_id:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Validate published source before resuming staged container publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_VERSION: ${{ inputs.version }}
          FLOW_SOURCE: ${{ inputs.source_ref }}
          FLOW_RUN: ${{ inputs.artifact_run_id }}
          FLOW_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          python3 -c 'import os,re; assert re.fullmatch(r"[a-f0-9]{40}",os.environ["FLOW_SOURCE"]); assert re.fullmatch(r"[1-9][0-9]*",os.environ["FLOW_RUN"])'
          test "$(python3 build/release.py --classify --tag "$FLOW_VERSION")" = "$FLOW_CHANNEL"
          test "$(git rev-parse HEAD)" = "$FLOW_SOURCE"
          test "$(git rev-parse "$FLOW_VERSION^{commit}")" = "$FLOW_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FLOW_RUN" > verified-source-run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$FLOW_VERSION" > published-release.json
          python3 -c 'import json,os; r=json.load(open("verified-source-run.json")); p=json.load(open("published-release.json")); assert r["status"]=="completed" and r["conclusion"]=="success" and r["head_sha"]==os.environ["FLOW_SOURCE"] and r["path"]==".github/workflows/ts_release.yml"; assert p["tag_name"]==os.environ["FLOW_VERSION"] and not p["draft"] and p["prerelease"]==(os.environ["FLOW_CHANNEL"]=="preview")'

      - name: Download linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TorrServer-LT-linux-*
          path: _artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      # Name each binary `torrserver` under dist/<arch>, where <arch> is exactly
      # buildx's $TARGETARCH$TARGETVARIANT (amd64 / arm64 / armv7), and set +x
      # (the artifact zip drops the executable bit).
      - name: Lay binaries out per Docker arch
        run: |
          set -euo pipefail
          install -D -m755 _artifacts/TorrServer-LT-linux-amd64 dist/amd64/torrserver
          install -D -m755 _artifacts/TorrServer-LT-linux-arm64 dist/arm64/torrserver
          install -D -m755 _artifacts/TorrServer-LT-linux-armv7 dist/armv7/torrserver

      - name: Set up QEMU            # only to run the base image's apt per arch
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify runtime linkage on every container architecture
        env:
          FLOW_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('MatriX.148.Flow-dev-{0}', github.sha)) }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            image="flow-runtime-check:${platform//\//-}"
            docker buildx build --platform "$platform" --load -t "$image" -f Dockerfile.runtime .
            actual=$(docker run --rm --platform "$platform" --entrypoint /usr/local/bin/torrserver "$image" --version)
            FLOW_ACTUAL="$actual" python3 -c 'import os,re; assert re.search(r"(?<![A-Za-z0-9.-])"+re.escape(os.environ["FLOW_VERSION"])+r"(?![A-Za-z0-9.-])",os.environ["FLOW_ACTUAL"]), "Container identity mismatch"'
            echo "$platform: runtime linkage and exact version verified"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case image repo
        run: echo "REG_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REG_REPO }}
          # Channel policy is explicit; suppress automatic latest generation.
          flavor: latest=false
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' && !inputs.version }}
            type=ref,event=tag,enable=${{ !inputs.version }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.release_channel == 'stable' }}
            type=raw,value=preview,enable=${{ inputs.release_channel == 'preview' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_ref || github.sha }}

      - name: Build and push multi-arch image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Don't upload the `<repo>.dockerbuild` build-record artifact — it shows
          # up in the release job's artifact set and breaks its download.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
