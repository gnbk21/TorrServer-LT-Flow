name: Flow branch checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
concurrency:
  group: october-${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  inventory-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - working-directory: web
        run: yarn install --frozen-lockfile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Official schema, graph integrity and generated inventories
        env:
          FLOW_SBOM_SCHEMA_CHECK: '1'
        run: |
          node --test build/validate_sbom_test.cjs
          python build/sbom_test.py
          python -m unittest discover -s build -p 'player_sbom_test.py'
  windows-interface-guard:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build Windows SDK guard
        shell: pwsh
        run: ./build/build-windows-interface-guard.ps1
      - name: Disposable kernel enforcement and independent policy removal
        shell: pwsh
        env:
          FLOW_ISOLATED_WFP: github-hosted
        run: ./build/test-windows-interface-guard.ps1 -Guard .tools/windows-interface-guard/FlowNetworkGuard-windows-amd64.exe -InstallFixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: flow-wfp-sdk-check
          path: .tools/windows-interface-guard-check/report.json
          if-no-files-found: error
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: go test -p 2 ./cachefs ./console ./log ./flow ./diagnostics ./web/pages/template
      - name: Portable library export privacy and format checks
        working-directory: server
        run: go test ./web/api/library_export_projection.go ./web/api/library_export_projection_test.go
      - name: 32-bit settings metadata integer bounds
        working-directory: server
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test ./settings/metadata_integer.go ./settings/metadata_integer_test.go
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s build -p '*_test.py'
      - name: Every Go test directory belongs to an executed suite
        run: python build/test_packages.py
      - name: Parse Windows distribution scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem distribution/*.ps1,build/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Verify installer channel selection
        shell: pwsh
        run: ./build/test-release-channels.ps1
      - name: Verify disposable IPv6 fixture admission and rollback without network changes
        shell: pwsh
        run: ./build/test-guard-ipv6-fixture.ps1
  web:
    uses: ./.github/workflows/build-web.yml
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && 'flow-web-pr' || 'flow-web-develop' }}
