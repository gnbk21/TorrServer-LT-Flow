name: Flow request capacity diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing build with native symbol fixtures; actual binary identity is retained in the report'
        type: string
        required: true
      case:
        description: 'Strict reqq:latency-ms:piece-MiB case to reproduce'
        type: choice
        options: ['32:250:1', '64:250:1', '250:250:1', '512:250:1', '2000:250:16']
        default: '64:250:1'
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-amd64, suffix: ''}
          - {os: windows-latest, target: windows-amd64, suffix: '.exe'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Record immutable fixture source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p evidence
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,url > evidence/SOURCE_RUN.json
      - uses: actions/download-artifact@v4
        with:
          name: flow-native-profile-${{ matrix.target }}
          path: fixture
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Repeat real-engine strict capacity case with fresh state
        shell: bash
        env:
          CASE: ${{ inputs.case }}
          EXECUTABLE: fixture/TorrServer-LT-${{ matrix.target }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          chmod +x "$EXECUTABLE"
          sha256sum "$EXECUTABLE" > evidence/EXECUTABLE_SHA256.txt
          python build/request_capacity_check.py --executable "$EXECUTABLE" --output evidence/capacity --case "$CASE" --repeat 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-capacity-${{ matrix.target }}
          path: |
            evidence/SOURCE_RUN.json
            evidence/EXECUTABLE_SHA256.txt
            evidence/**/report.json
            evidence/**/server-output.log
          if-no-files-found: error
