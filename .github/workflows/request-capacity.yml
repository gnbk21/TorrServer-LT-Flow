name: Flow request capacity diagnostics
on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      case:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing build with native symbol fixtures; actual binary identity is retained in the report'
        type: string
        required: true
      case:
        description: 'Strict reqq:latency-ms:piece-MiB case to reproduce'
        type: choice
        options: ['32:250:1', '64:250:1', '250:250:1', '512:250:1', '2000:250:16']
        default: '64:250:1'
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-amd64, suffix: ''}
          - {os: windows-latest, target: windows-amd64, suffix: '.exe'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Record immutable fixture source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p evidence
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,headSha,url > evidence/SOURCE_RUN.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-native-profile-${{ matrix.target }}
          path: fixture
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Repeat real-engine strict capacity case with fresh state
        shell: bash
        env:
          CASE: ${{ inputs.case }}
          EXECUTABLE: fixture/TorrServer-LT-${{ matrix.target }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          chmod +x "$EXECUTABLE"
          sha256sum "$EXECUTABLE" > evidence/EXECUTABLE_SHA256.txt
          python build/request_capacity_check.py --executable "$EXECUTABLE" --output evidence/capacity --case "$CASE" --repeat 10
      - name: Check cold cancellation and late disk completions
        shell: bash
        env:
          EXECUTABLE: fixture/TorrServer-LT-${{ matrix.target }}${{ matrix.suffix }}
        run: python build/request_cancel_check.py --executable "$EXECUTABLE" --output evidence/cancel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flow-capacity-${{ matrix.target }}
          path: |
            evidence/SOURCE_RUN.json
            evidence/EXECUTABLE_SHA256.txt
            evidence/**/report.json
            evidence/**/server-output.log
          if-no-files-found: error
