name: Recover verified release platforms
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Original completed tagged release run ID
        required: true
        type: string
      security_run:
        description: Successful CodeQL run for the exact binary source
        required: true
        type: string
      source_commit:
        description: Original immutable 40-character binary source
        required: true
        type: string
      tag:
        description: Existing immutable Flow release tag
        required: true
        type: string
      platforms:
        description: Select verified platforms explicitly; missing macOS requires approval below
        type: choice
        options: [all, non-macos]
        default: all
      omission_reason:
        description: Owner-approved explanation for excluding macOS (required for non-macos)
        type: string
      publish:
        description: Publish a NEW release after all checks; otherwise upload a candidate only
        type: boolean
        default: false
      latest:
        description: Explicitly mark a new stable release Latest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: recovery-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLOW_SOURCE: ${{ inputs.source_commit }}
      FLOW_TAG: ${{ inputs.tag }}
      FLOW_RUN: ${{ inputs.source_run }}
      FLOW_SECURITY_RUN: ${{ inputs.security_run }}
      FLOW_PLATFORMS: ${{ inputs.platforms }}
      FLOW_REASON: ${{ inputs.omission_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate source, gates and explicit platform selection
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          python3 -m unittest discover -s build -p '*release*test.py'
          python3 -m unittest discover -s build -p 'platform_recovery_test.py'
          options=()
          if [ "$FLOW_PLATFORMS" = non-macos ]; then
            options+=(--allow-missing-macos --reason "$FLOW_REASON")
          fi
          python3 build/platform_recovery.py --run "$FLOW_RUN" --security-run "$FLOW_SECURITY_RUN" --tag "$FLOW_TAG" --source "$FLOW_SOURCE" --output recovery-evidence.json "${options[@]}"
      - name: Refuse replacement of published assets
        if: inputs.publish
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > existing-releases.json
          python3 -c 'import json,os; assert not any(r["tag_name"]==os.environ["FLOW_TAG"] for page in json.load(open("existing-releases.json")) for r in page), "Existing releases must not be overwritten by platform recovery"'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - working-directory: web
        run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TorrServer-*
          path: artifacts
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flow-runtime-notices-*
          path: artifacts
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-interface-guard-windows
          path: artifacts/interface-guard
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-web-cross
          path: server/web/pages/template
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.9-v1
      - run: bash build/_fetch_sources.sh
      - working-directory: server
        run: go mod download
      - name: Package reproducibly with distinct binary and workflow identity
        run: |
          set -euo pipefail
          for output in dist reproducibility-check; do
            python3 build/release.py --tag "$FLOW_TAG" --commit "$FLOW_SOURCE" --artifacts artifacts --native-sources _src --output "$output" --platform-scope "$FLOW_PLATFORMS" --packaging-commit "$GITHUB_SHA" --availability-reason "$FLOW_REASON" --recovery-provenance
          done
          cmp dist/SHA256SUMS reproducibility-check/SHA256SUMS
          node build/validate_sbom.cjs dist/SBOM.cdx.json
          python3 -c 'from pathlib import Path; import os; p=Path("recovery-notes.md"); p.write_text("Recovered verified artifacts for "+os.environ["FLOW_TAG"]+". Binary source: "+os.environ["FLOW_SOURCE"]+".\n\n"+(os.environ["FLOW_REASON"] if os.environ["FLOW_PLATFORMS"]!="all" else "All eight platforms included.")+"\nSee recovery-evidence.json for the original successful checks.\n")'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-platform-recovery
          path: |
            dist/*
            recovery-evidence.json
            recovery-notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish explicitly selected new release without replacing assets
        if: inputs.publish
        env:
          FLOW_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$FLOW_TAG^{commit}")" = "$FLOW_SOURCE"
          channel=$(python3 build/release.py --classify --tag "$FLOW_TAG")
          options=(--latest=false)
          if [ "$channel" = preview ]; then
            options+=(--prerelease)
          elif [ "$FLOW_LATEST" = true ]; then
            options=(--latest)
          fi
          # Create fails atomically if another workflow published first. The
          # usual upsert action could otherwise replace existing release assets.
          gh release create "$FLOW_TAG" dist/* recovery-evidence.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "$FLOW_TAG" --notes-file recovery-notes.md "${options[@]}"

  docker:
    needs: recover
    if: inputs.publish
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      source_ref: ${{ inputs.source_commit }}
      artifact_run_id: ${{ inputs.source_run }}
      version: ${{ inputs.tag }}
      release_channel: ${{ (contains(inputs.tag, '-rc.') || contains(inputs.tag, '-preview.') || contains(inputs.tag, '-alpha.') || contains(inputs.tag, '-beta.')) && 'preview' || 'stable' }}
