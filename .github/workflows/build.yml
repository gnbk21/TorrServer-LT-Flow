name: build

# Cross-compiles every non-macOS target on a single fast x86 ubuntu runner via
# the build/<target>.sh scripts — no Docker, no QEMU emulation, no MSYS2.
# macOS is built natively on macos runners in build-macos.yml.

on:
  # No `push` trigger: the full cross-compile does NOT run on every push to
  # master. Build manually (workflow_dispatch) or via a release tag, which
  # reuses this workflow through ts_release.yml's workflow_call.
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      evaluate_pgo:
        description: 'Compare an opt-in Go PGO build using generated playback fixtures'
        type: boolean
        default: false
  # Reused by ts_release.yml on a tag; `version` stamps the binaries.
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      release_channel:
        type: string
        default: 'development'
      evaluate_pgo:
        type: boolean
        default: false

jobs:
  web:
    uses: ./.github/workflows/build-web.yml
    with:
      artifact-name: flow-web-cross

  # Fetch Boost + libtorrent once and cache _src, so the matrix below doesn't
  # download Boost (~120 MB) and clone libtorrent six times in parallel.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.0-ossl3.5.7-v1
      - name: Fetch Boost + libtorrent
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/_fetch_sources.sh

  cross:
    needs: [sources, web]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - linux-armv7
          - windows-amd64
          - android-arm64
          - android-armv7
    steps:
      - uses: actions/checkout@v4

      - name: Download freshly generated web UI
        uses: actions/download-artifact@v4
        with:
          name: flow-web-cross
          path: server/web/pages/template

      - name: Restore Boost + libtorrent sources
        uses: actions/cache@v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.0-ossl3.5.7-v1

      # Cache the per-target install tree (lib + headers + .pc). With it present
      # build_libtorrent short-circuits and only the Go binary is relinked.
      - name: Cache libtorrent install tree
        uses: actions/cache@v4
        with:
          path: _deps/${{ matrix.target }}
          key: deps-${{ matrix.target }}-boost1.85.0-lt2.1.0-ossl3.5.7-v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install toolchain
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-amd64)   : ;;  # host gcc/g++ already present
            linux-arm64)   sudo apt-get update -qq && sudo apt-get install -y g++-aarch64-linux-gnu ;;
            linux-armv7)   sudo apt-get update -qq && sudo apt-get install -y g++-arm-linux-gnueabihf ;;
            windows-amd64) sudo apt-get update -qq && sudo apt-get install -y g++-mingw-w64-x86-64 ;;
            android-*)     echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        env:
          TS_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: bash build/${{ matrix.target }}.sh

      # Only linux-amd64 runs on the x86 host; use it as the test + smoke gate.
      - name: Unit tests
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go test -count=1 -timeout 180s ./diagnostics/ ./flow/ ./ffprobe/ ./settings/ ./lt/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/api/ ./web/pages/template/ ./dlna/ ./cmd/

      - name: Go vet
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go vet ./flow/ ./ffprobe/ ./settings/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/api/

      - name: Export actual API contracts
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
          FLOW_CONTRACT_OUTPUT: ${{ github.workspace }}/_out/api-contracts.json
        run: go test ./web/api -run '^TestExportFrontendContracts$' -count=1

      - uses: actions/setup-node@v4
        if: matrix.target == 'linux-amd64'
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Verify API contracts with frontend validators
        if: matrix.target == 'linux-amd64'
        working-directory: web
        env:
          FLOW_CONTRACT_INPUT: ${{ github.workspace }}/_out/api-contracts.json
        run: |
          yarn install --frozen-lockfile
          yarn vitest run src/api/contracts.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-amd64'
        with:
          name: flow-api-contracts
          path: _out/api-contracts.json
          if-no-files-found: error

      - name: Race tests and reachable Go vulnerability scan
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: |
          go test -race -count=1 -timeout 180s ./flow/ ./settings/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/api/
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Probe --version
        if: matrix.target == 'linux-amd64'
        run: |
          _out/TorrServer-LT-linux-amd64 --version
          _out/TorrServer-LT-linux-amd64-gst --version

      - name: Bounded fuzz campaigns
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: |
          go test ./flow -run '^$' -fuzz '^FuzzRangeHint$' -fuzztime=10s -parallel=2
          go test ./settings -run '^$' -fuzz '^FuzzBackupImport$' -fuzztime=10s -parallel=2
          go test ./settings -run '^$' -fuzz '^FuzzFlowSettings$' -fuzztime=10s -parallel=2
          go test ./torr -run '^$' -fuzz '^FuzzTrackerURLRedaction$' -fuzztime=10s -parallel=2

      - name: Authenticated backup, maintenance and startup diagnostics
        if: matrix.target == 'linux-amd64'
        run: python3 build/maintenance_harness.py --executable _out/TorrServer-LT-linux-amd64 --output _out/maintenance-check

      - name: Library persistence measurement
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go test ./settings -run '^$' -bench '^BenchmarkLibrarySingleUpsert$' -benchtime=3x -benchmem | tee ../_out/library-upsert-benchmark.txt

      - name: Controlled peer playback and resource cycles
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 build/playback_harness.py --executable _out/TorrServer-LT-linux-amd64 --output _out/controlled-playback --duration 20
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'linux-amd64'
        with:
          name: flow-controlled-playback
          path: |
            _out/controlled-playback/report.json
            _out/controlled-playback/fixtures/fixtures.json
            _out/controlled-playback/*/server-output.log
            _out/maintenance-check/report.json
            _out/library-upsert-benchmark.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: TorrServer-LT-${{ matrix.target }}
          path: _out/TorrServer-LT-${{ matrix.target }}*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows-amd64'
        with:
          name: TorrServer-Flow-Tray
          path: tray/FlowTray.ps1
          if-no-files-found: error

      - name: Optional measured PGO comparison
        if: matrix.target == 'linux-amd64' && inputs.evaluate_pgo
        env:
          TS_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: |
          cp _out/TorrServer-LT-linux-amd64 _out/TorrServer-LT-linux-amd64-baseline
          python3 build/playback_harness.py --executable _out/TorrServer-LT-linux-amd64-baseline --output _out/pgo-training --fixtures _out/controlled-playback/fixtures --cases fast --profile
          go tool pprof -top _out/TorrServer-LT-linux-amd64-baseline _out/pgo-training/fast/profile.pprof > _out/pgo-training/cpu-top.txt
          TS_PGO_PROFILE="$PWD/_out/pgo-training/fast/profile.pprof" bash build/linux-amd64.sh
          python3 build/pgo_compare.py --baseline _out/TorrServer-LT-linux-amd64-baseline --candidate _out/TorrServer-LT-linux-amd64 --fixtures _out/controlled-playback/fixtures --output _out/pgo-comparison
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'linux-amd64' && inputs.evaluate_pgo
        with:
          name: flow-pgo-evaluation
          path: |
            _out/pgo-training/cpu-top.txt
            _out/pgo-training/fast/*.pprof
            _out/pgo-training/report.json
            _out/pgo-comparison/report.json

  windows-service:
    needs: cross
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorrServer-LT-windows-amd64
          path: service-binary
      - name: Restricted account lifecycle
        shell: pwsh
        run: ./build/test-windows-service.ps1 -Executable ./service-binary/TorrServer-LT-windows-amd64.exe -OutputDirectory ./service-test-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-windows-service-check
          path: |
            service-test-state/service-test.json
            service-test-state/flow.log

  # Assemble + push the multi-arch GHCR image straight from the linux binaries
  # the matrix just cross-built — no recompile and no QEMU for the binary (only
  # the base image's apt runs emulated, per arch). Publishes on master pushes and
  # on release tags (when this workflow is reused by ts_release.yml); never on
  # pull requests. See Dockerfile.runtime.
  docker:
    needs: cross
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: TorrServer-LT-linux-*
          path: _artifacts
          merge-multiple: true

      # Name each binary `torrserver` under dist/<arch>, where <arch> is exactly
      # buildx's $TARGETARCH$TARGETVARIANT (amd64 / arm64 / armv7), and set +x
      # (the artifact zip drops the executable bit).
      - name: Lay binaries out per Docker arch
        run: |
          set -euo pipefail
          install -D -m755 _artifacts/TorrServer-LT-linux-amd64 dist/amd64/torrserver
          install -D -m755 _artifacts/TorrServer-LT-linux-arm64 dist/arm64/torrserver
          install -D -m755 _artifacts/TorrServer-LT-linux-armv7 dist/armv7/torrserver

      - name: Set up QEMU            # only to run the base image's apt per arch
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case image repo
        run: echo "REG_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REG_REPO }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ inputs.release_channel == 'stable' }}
            type=raw,value=preview,enable=${{ inputs.release_channel == 'preview' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        env:
          # Don't upload the `<repo>.dockerbuild` build-record artifact — it shows
          # up in the release job's artifact set and breaks its download.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
