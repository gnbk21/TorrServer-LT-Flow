name: build

# Cross-compiles every non-macOS target on a single fast x86 ubuntu runner via
# the build/<target>.sh scripts — no Docker, no QEMU emulation, no MSYS2.
# macOS is built natively on macos runners in build-macos.yml.

on:
  # No `push` trigger: the full cross-compile does NOT run on every push to
  # master. Build manually (workflow_dispatch) or via a release tag, which
  # reuses this workflow through ts_release.yml's workflow_call.
  pull_request:
    branches: [master, develop]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      profile_source_run_id:
        description: 'Capture native CPU using symbol fixtures from an existing build; skips rebuilding'
        type: string
        default: ''
      capacity_case:
        description: 'Repeat a strict-cap case using profile_source_run_id fixtures instead of capturing CPU'
        type: string
        default: ''
      evaluate_pgo:
        description: 'Compare an opt-in Go PGO build using generated playback fixtures'
        type: boolean
        default: false
      evaluate_sparse_baseline:
        description: 'Build and compare original, stable-only, queue-fixed and current sparse runtimes'
        type: boolean
        default: false
  # Reused by ts_release.yml on a tag; `version` stamps the binaries.
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      web_artifact:
        description: 'Validated embedded UI artifact from this same workflow run'
        type: string
        default: ''
      validation_scope:
        description: 'full, or essential when the caller proves an unchanged previously validated runtime'
        type: string
        default: full
      release_channel:
        type: string
        default: 'development'
      evaluate_pgo:
        type: boolean
        default: false
      evaluate_sparse_baseline:
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.profile_source_run_id || 'full' }}
  # A newer PR source supersedes its older development checks. Manual/tag/release
  # runs keep their complete comparison and rollback evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-inventory:
    needs: [cross, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - working-directory: web
        run: yarn install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - run: bash build/_fetch_sources.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: TorrServer-LT-*
          path: inventory-binaries
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-interface-guard-windows
          path: inventory-binaries/interface-guard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.web_artifact || 'flow-web-cross' }}
          path: server/web/pages/template
      - name: Validate actual cross-platform binary and dependency inventory
        env:
          FLOW_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: |
          python3 build/sbom.py --artifacts inventory-binaries --native-sources _src --output inventory/SBOM.cdx.json --tag "$FLOW_VERSION" --commit "$GITHUB_SHA"
          node build/validate_sbom.cjs inventory/SBOM.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: flow-cross-inventory
          path: inventory/SBOM.cdx.json
          if-no-files-found: error
  upgrade-profile-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/flow-upgrade'
    needs: [cross]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/upgrade-benchmarks.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      comparison: profiles
  upgrade-transport-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/flow-upgrade'
    needs: [cross]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/upgrade-benchmarks.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
      comparison: transport
  windows-network-notifications:
    if: ${{ !inputs.profile_source_run_id }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Notification registration and cancellation
        working-directory: server
        run: |
          go test -count=1 ./netchange ./flow ./diagnostics
          go test -count=1 ./torr/storage/torrstor/disk_handles.go ./torr/storage/torrstor/disk_handles_test.go
          go test -count=1 ./web/auth/rejected_body.go ./web/auth/rejected_body_test.go
  sparse-native-layers:
    if: inputs.evaluate_sparse_baseline
    needs: [cross, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.web_artifact || 'flow-web-cross' }}
          path: server/web/pages/template
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TorrServer-LT-linux-amd64
          path: _out/sparse-current
      - name: Isolate and measure native layers
        run: |
          set -euo pipefail
          chmod +x _out/sparse-current/TorrServer-LT-linux-amd64
          bash build/ci-apt.sh ffmpeg cmake pkg-config
          bash build/sparse_native_layers.sh 2>&1 | tee _out/sparse-native-layers-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: flow-sparse-native-layers
          path: |
            _out/sparse-native-layers/results/**/report.json
            _out/sparse-native-layers/results/**/server-output.log
            _out/sparse-native-layers/fixtures/fixtures.json
            _out/sparse-native-layers/*.bin
            _out/sparse-native-layers-build.log
          if-no-files-found: error
  web:
    if: ${{ !inputs.profile_source_run_id }}
    uses: ./.github/workflows/build-web.yml
    with:
      artifact-name: flow-web-cross
      reuse-artifact: ${{ inputs.web_artifact }}

  # Fetch Boost + libtorrent once and cache _src, so the matrix below doesn't
  # download Boost (~120 MB) and clone libtorrent six times in parallel.
  sources:
    if: ${{ !inputs.profile_source_run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - name: Fetch Boost + libtorrent
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/_fetch_sources.sh

  native-streaming-tests:
    name: Native queue and deadline simulations
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - name: Verify patch isolation and reviewed source
        run: |
          bash build/_fetch_sources.sh
          python3 build/native_patch_checks.py
      - name: Upstream queue and deadline simulations
        run: |
          source build/_deps.sh
          ensure_b2
          python3 build/apply_native_patches.py "$LT_DIR"
          cd "$LT_DIR/simulation"
          BOOST_ROOT="$BOOST_DIR" "$BOOST_DIR/b2" -q -j2 crypto=built-in webtorrent=off test_peer_connection test_transfer

  cross:
    needs: [sources, web]
    if: ${{ !cancelled() && needs.sources.result == 'success' && needs.web.result == 'success' }}
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - linux-armv7
          - windows-amd64
          - android-arm64
          - android-armv7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download freshly generated web UI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.web_artifact || 'flow-web-cross' }}
          path: server/web/pages/template

      - name: Restore Boost + libtorrent sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1

      # Cache the per-target install tree (lib + headers + .pc). With it present
      # build_libtorrent short-circuits and only the Go binary is relinked.
      - name: Cache libtorrent install tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _deps/${{ matrix.target }}
          key: deps-${{ matrix.target }}-boost1.85.0-lt2.1.2-ossl3.5.7-flowsparse-pcfold2-${{ hashFiles('build/native-patches/**', 'build/apply_native_patches.py', 'build/patch_libtorrent_header.py') }}
          restore-keys: deps-${{ matrix.target }}-boost1.85.0-lt2.1.2-ossl3.5.7-

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-amd64)   : ;;  # host gcc/g++ already present
            linux-arm64)   bash build/ci-apt.sh g++-aarch64-linux-gnu ;;
            linux-armv7)   bash build/ci-apt.sh g++-arm-linux-gnueabihf ;;
            windows-amd64) bash build/ci-apt.sh g++-mingw-w64-x86-64 ;;
            android-*)     echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV" ;;
          esac

      - name: Preserve static toolchain runtime notices
        if: matrix.target == 'windows-amd64' || startsWith(matrix.target, 'android-')
        run: python3 build/runtime_notices.py --target '${{ matrix.target }}' --output '_out/RUNTIME_NOTICES-${{ matrix.target }}.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'windows-amd64' || startsWith(matrix.target, 'android-')
        with:
          retention-days: 14
          name: flow-runtime-notices-${{ matrix.target }}
          path: _out/RUNTIME_NOTICES-${{ matrix.target }}.txt
          if-no-files-found: error

      - name: Build
        env:
          TS_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: bash build/${{ matrix.target }}.sh

      - name: Retain exact Linux native dependencies for validation
        if: matrix.target == 'linux-amd64'
        run: tar -czf _out/linux-native-deps.tar.gz _deps/linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'linux-amd64'
        with:
          retention-days: 3
          name: flow-linux-native-deps
          path: _out/linux-native-deps.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: TorrServer-LT-${{ matrix.target }}
          path: _out/TorrServer-LT-${{ matrix.target }}*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'windows-amd64'
        with:
          retention-days: 14
          name: TorrServer-Flow-Tray
          path: tray/FlowTray.ps1
          if-no-files-found: error

      # Primary artifacts are already uploaded. Build a differently stamped
      # native fixture for updater lifecycle tests; never publish this fixture.
      - name: Build optional Windows interface guard
        if: matrix.target == 'windows-amd64'
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -static-libgcc -static-libstdc++ -municode -D_WIN32_WINNT=0x0A00 -DUNICODE -D_UNICODE build/windows-interface-guard.cpp -o _out/FlowNetworkGuard-windows-amd64.exe -lfwpuclnt -liphlpapi -ladvapi32 -lole32 -lws2_32
          python3 build/guard_manifest.py --binary _out/FlowNetworkGuard-windows-amd64.exe --output _out/FlowNetworkGuard-build.json --compiler x86_64-w64-mingw32-g++
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'windows-amd64'
        with:
          retention-days: 14
          name: flow-interface-guard-windows
          path: |
            _out/FlowNetworkGuard-windows-amd64.exe
            _out/FlowNetworkGuard-build.json
          if-no-files-found: error

      - name: Build update lifecycle fixture
        if: matrix.target == 'windows-amd64'
        env:
          TS_VERSION: MatriX.145.Flow-v0.0.0-rc.0
        run: bash build/windows-amd64.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'windows-amd64'
        with:
          retention-days: 14
          name: flow-windows-update-fixture
          path: _out/TorrServer-LT-windows-amd64.exe
          if-no-files-found: error

      # Unpublished branch builds have development identities and deliberately
      # cannot pass release selection. Give the same native source a valid test
      # prerelease identity; tagged builds test their actual release binary.
      - name: Build branch update candidate fixture
        if: matrix.target == 'windows-amd64' && inputs.version == ''
        env:
          TS_VERSION: MatriX.145.Flow-v0.0.0-rc.1
        run: bash build/windows-amd64.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'windows-amd64' && inputs.version == ''
        with:
          retention-days: 14
          name: flow-windows-update-candidate
          path: _out/TorrServer-LT-windows-amd64.exe
          if-no-files-found: error

      # Ordinary and updater artifacts above retain their original stripping.
      # Keep symbols only in a separate, unpublished profiler fixture.
      - name: Build symbol-preserving native profiler fixture
        if: matrix.target == 'linux-amd64' || matrix.target == 'windows-amd64'
        env:
          TS_PROFILE_SYMBOLS: '1'
          TS_VERSION: ${{ format('MatriX.145.Flow-profile-{0}', github.sha) }}
        run: bash build/${{ matrix.target }}.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'linux-amd64' || matrix.target == 'windows-amd64'
        with:
          retention-days: 14
          name: flow-native-profile-${{ matrix.target }}
          path: _out/TorrServer-LT-${{ matrix.target }}${{ matrix.target == 'windows-amd64' && '.exe' || '' }}
          if-no-files-found: error

  linux-validation:
    needs: cross
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.web_artifact || 'flow-web-cross' }}
          path: server/web/pages/template
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TorrServer-LT-linux-amd64
          path: _out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-linux-native-deps
          path: _out
      - name: Restore exact native build and fixture permissions
        run: |
          tar -xzf _out/linux-native-deps.tar.gz
          chmod +x _out/TorrServer-LT-linux-amd64*
          bash build/_fetch_sources.sh
      # Only linux-amd64 runs on the x86 host; use it as the test + smoke gate.
      - name: Native upload cache-miss regression
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer build/test_disk_upload.cpp -o _out/test-disk-upload -L"$PWD/_deps/linux-amd64/lib" $(pkg-config --cflags --libs libtorrent-rasterbar) -pthread
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer build/test_io_queue.cpp -o _out/test-io-queue -pthread
          _out/test-io-queue
          _out/test-disk-upload

      - name: Prepare real GStreamer media validation
        timeout-minutes: 10
        run: |
          bash build/ci-apt.sh ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base-apps gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 12 -c:v libx264 -preset ultrafast -g 75 -c:a aac -y _out/gst-e2e.mkv

      - name: Unit tests
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: |
          go test -count=1 -timeout 180s ./ ./mimetype/ ./torznab/ ./jacred/ ./console/ ./log/ ./diagnostics/ ./flow/ ./netpolicy/ ./netchange/ ./ffprobe/ ./settings/ ./lt/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/auth/ ./web/api/ ./web/msx/ ./web/pages/template/ ./dlna/ ./web/sslcerts/ ./torr/utils/ ./cmd/
          GST_E2E_MKV="$GITHUB_WORKSPACE/_out/gst-e2e.mkv" go test -tags gst -count=1 -timeout 180s ./gstreamer/

      - name: Go vet
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go vet ./console/ ./cmd/ ./flow/ ./netpolicy/ ./netchange/ ./ffprobe/ ./settings/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/auth/ ./web/api/ ./web/sslcerts/ ./torr/utils/

      - name: Export actual API contracts
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
          FLOW_CONTRACT_OUTPUT: ${{ github.workspace }}/_out/api-contracts.json
        run: go test ./web/api -run '^TestExportFrontendContracts$' -count=1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Verify API contracts with frontend validators
        working-directory: web
        env:
          FLOW_CONTRACT_INPUT: ${{ github.workspace }}/_out/api-contracts.json
        run: |
          yarn install --frozen-lockfile
          yarn vitest run src/api/contracts.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: flow-api-contracts
          path: _out/api-contracts.json
          if-no-files-found: error

      - name: Race tests and reachable Go vulnerability scan
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: |
          go test -race -count=1 -timeout 180s ./ ./mimetype/ ./torznab/ ./jacred/ ./console/ ./log/ ./flow/ ./netpolicy/ ./netchange/ ./settings/ ./lt/ ./torr/ ./torr/storage/torrstor/ ./web/ ./web/auth/ ./web/api/ ./web/msx/ ./web/sslcerts/ ./torr/utils/ ./mcp/ ./tgbot/
          go test -race -tags gst -count=1 -timeout 180s ./gstreamer/
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          govulncheck -tags gst ./...

      - name: Probe --version
        run: |
          _out/TorrServer-LT-linux-amd64 --version
          _out/TorrServer-LT-linux-amd64-gst --version

      - name: Bounded fuzz campaigns
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: |
          go test ./flow -run '^$' -fuzz '^FuzzRangeHint$' -fuzztime=10s -parallel=2
          go test ./flow -run '^$' -fuzz '^FuzzResidentIndex$' -fuzztime=100000x -timeout=180s -parallel=2
          go test ./settings -run '^$' -fuzz '^FuzzBackupImport$' -fuzztime=10s -parallel=2
          go test ./settings -run '^$' -fuzz '^FuzzFlowSettings$' -fuzztime=10s -parallel=2
          # A timed coordinator shutdown intermittently returned "context
          # deadline exceeded" without a failing input. Use a larger fixed
          # execution budget; the test timeout still catches hung targets.
          go test ./torr -run '^$' -fuzz '^FuzzTrackerURLRedaction$' -fuzztime=100000x -timeout=180s -parallel=2
      - name: Retain minimized fuzz failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: flow-fuzz-failures
          path: server/**/testdata/fuzz/**
          if-no-files-found: ignore

      - name: Library persistence measurement
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go test ./settings -run '^$' -bench '^BenchmarkLibrarySingleUpsert$' -benchtime=3x -benchmem | tee ../_out/library-upsert-benchmark.txt

      - name: Optional measured PGO comparison
        if: inputs.evaluate_pgo
        env:
          TS_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: |
          cp _out/TorrServer-LT-linux-amd64 _out/TorrServer-LT-linux-amd64-baseline
          python3 build/high_bitrate_check.py --executable _out/TorrServer-LT-linux-amd64-baseline --output _out/pgo-training --profile adaptive --mbps 120 --seconds 60 --cache-mb 512 --preload --capture-go --cases healthy outages mixed-peers bursts
          # Keep runtime-recorded Go symbols. Local re-symbolization of the
          # stripped release ELF can assign incorrect function names to PCs.
          go tool pprof -symbolize=none -proto _out/pgo-training/{healthy,outages,mixed-peers,bursts}/profile.pprof > _out/pgo-training/representative.pprof
          go tool pprof -symbolize=none -top _out/pgo-training/representative.pprof > _out/pgo-training/cpu-top.txt
          TS_PGO_PROFILE="$PWD/_out/pgo-training/representative.pprof" bash build/linux-amd64.sh
          python3 build/pgo_compare.py --baseline _out/TorrServer-LT-linux-amd64-baseline --candidate _out/TorrServer-LT-linux-amd64 --fixture _out/pgo-training/fixture/generated.ts --output _out/pgo-comparison
          # Restore the ordinary build. This runner never uploads release
          # binaries; optional measurements cannot replace the build artifacts.
          cp _out/TorrServer-LT-linux-amd64-baseline _out/TorrServer-LT-linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.evaluate_pgo
        with:
          retention-days: 14
          name: flow-pgo-evaluation
          path: |
            _out/pgo-training/cpu-top.txt
            _out/pgo-training/**/*.pprof
            _out/pgo-training/representative.pprof
            _out/pgo-training/report.json
            _out/pgo-training/**/report.json
            _out/pgo-training/**/server-output.log
            _out/pgo-comparison/report.json
            _out/pgo-comparison/*/failure.json
            _out/pgo-comparison/*/server-output.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: flow-controlled-part-native
          path: _out/library-upsert-benchmark.txt
          if-no-files-found: warn

  controlled-integration:
    needs: cross
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [playback, startup, discovery, preparation, adaptive, requests, sparse, maintenance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TorrServer-LT-linux-amd64
          path: _out
      - name: Install media fixture tools
        timeout-minutes: 10
        run: bash build/ci-apt.sh ffmpeg
      - name: Run isolated functional group
        run: |
          chmod +x _out/TorrServer-LT-linux-amd64
          bash build/ci-integration.sh '${{ matrix.group }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: flow-controlled-part-${{ matrix.group }}
          path: |
            _out/**/report.json
            _out/**/fixtures.json
            _out/**/server-output.log
            _out/**/failure.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.group == 'maintenance'
        with:
          retention-days: 14
          name: flow-console-check
          path: _out/console-check
          if-no-files-found: warn

  controlled-evidence:
    needs: [linux-validation, controlled-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flow-controlled-part-*
          merge-multiple: true
          path: _out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: flow-controlled-playback
          path: _out
          if-no-files-found: error

  native-profiling:
    needs: cross
    if: ${{ always() && inputs.validation_scope != 'essential' && !inputs.capacity_case && (inputs.profile_source_run_id || needs.cross.result == 'success') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-profile.yml
    with:
      source_run_id: ${{ inputs.profile_source_run_id || format('{0}', github.run_id) }}
  request-capacity-diagnostics:
    if: inputs.profile_source_run_id && inputs.capacity_case
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/request-capacity.yml
    with:
      source_run_id: ${{ inputs.profile_source_run_id }}
      case: ${{ inputs.capacity_case }}

  high-bitrate-comparison:
    needs: cross
    if: inputs.validation_scope != 'essential'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mbps: 90, case: healthy, cache: 512, piece: 1, backend: ram}
          - {mbps: 120, case: healthy, cache: 2048, piece: 16, backend: disk}
          - {mbps: 90, case: outages, cache: 512, piece: 4, backend: disk}
          - {mbps: 120, case: outages, cache: 512, piece: 4, backend: ram}
          - {mbps: 90, case: mixed-peers, cache: 2048, piece: 4, backend: ram}
          - {mbps: 120, case: mixed-peers, cache: 512, piece: 4, backend: disk}
          - {mbps: 90, case: bursts, cache: 512, piece: 4, backend: ram}
          - {mbps: 120, case: bursts, cache: 2048, piece: 4, backend: disk}
          - {mbps: 90, case: stragglers, cache: 512, piece: 8, backend: ram}
          - {mbps: 120, case: stragglers, cache: 512, piece: 8, backend: disk}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TorrServer-LT-linux-amd64
          path: _out
      - name: Verify immutable stable straggler baseline
        if: matrix.case == 'stragglers'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA256: c2150033a8c101ef35bf4035a427733812baed6bc3a6c4015b5c15723dc368d4
        run: |
          gh release download MatriX.145.Flow-v1.1.3 --repo "$GITHUB_REPOSITORY" --pattern TorrServer-LT-linux-amd64 --dir _baseline
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path("_baseline/TorrServer-LT-linux-amd64"); assert hashlib.file_digest(p.open("rb"),"sha256").hexdigest()==os.environ["BASELINE_SHA256"], "Stable baseline digest mismatch"'
          chmod +x _baseline/TorrServer-LT-linux-amd64
          _baseline/TorrServer-LT-linux-amd64 --version
      - name: Rotated original-quality byte transport comparisons
        run: |
          chmod +x _out/TorrServer-LT-linux-amd64
          bash build/ci-apt.sh ffmpeg
          python3 build/high_bitrate_matrix.py --executable _out/TorrServer-LT-linux-amd64 --output _out/high-bitrate --mbps '${{ matrix.mbps }}' --cases '${{ matrix.case }}' --cache-mb '${{ matrix.cache }}' --piece-mb '${{ matrix.piece }}' --rotations ${{ matrix.case == 'stragglers' && '5' || '3' }} --seconds ${{ matrix.case == 'stragglers' && '30' || '120' }} --experiments ${{ matrix.backend == 'disk' && '--disk' || '' }} ${{ matrix.case == 'stragglers' && '--baseline _baseline/TorrServer-LT-linux-amd64' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: high-bitrate-${{ matrix.mbps }}-${{ matrix.case }}-${{ matrix.backend }}
          path: |
            _out/high-bitrate/**/report.json
            _out/high-bitrate/report.json
            _out/high-bitrate/**/server-output.log
          if-no-files-found: error

  windows-service:
    needs: cross
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build read-only SCM policy probe
        working-directory: server
        run: go build -o ../service-recovery-probe.exe ../build/service_recovery_probe_windows.go
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TorrServer-LT-windows-amd64
          path: service-binary
      - name: Cold cancellation and late disk completion regression
        run: python build/request_cancel_check.py --executable ./service-binary/TorrServer-LT-windows-amd64.exe --output ./request-cancel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-interface-guard-windows
          path: interface-guard
      - name: Isolated per-executable WFP installation, protocol and removal checks
        env:
          FLOW_ISOLATED_WFP: github-hosted
        shell: pwsh
        run: ./build/test-windows-interface-guard.ps1 -Guard ./interface-guard/FlowNetworkGuard-windows-amd64.exe -OutputDirectory ./interface-guard-check -InstallFixture
      - name: Restricted account lifecycle
        shell: pwsh
        run: ./build/test-windows-service.ps1 -Executable ./service-binary/TorrServer-LT-windows-amd64.exe -OutputDirectory ./service-test-state -RecoveryProbe ./service-recovery-probe.exe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-windows-update-fixture
          path: update-fixture
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.version == ''
        with:
          name: flow-windows-update-candidate
          path: update-candidate
      - name: Authenticated update and startup failure rollback
        shell: pwsh
        run: ./build/test-windows-update.ps1 -Baseline ./update-fixture/TorrServer-LT-windows-amd64.exe -Candidate '${{ inputs.version != '' && './service-binary/TorrServer-LT-windows-amd64.exe' || './update-candidate/TorrServer-LT-windows-amd64.exe' }}' -OutputDirectory ./update-test-state -Commit '${{ github.sha }}'
      - name: Restricted service update and migration rollback
        shell: pwsh
        run: ./build/test-windows-update.ps1 -Baseline ./update-fixture/TorrServer-LT-windows-amd64.exe -Candidate '${{ inputs.version != '' && './service-binary/TorrServer-LT-windows-amd64.exe' || './update-candidate/TorrServer-LT-windows-amd64.exe' }}' -OutputDirectory ./service-update-test-state -Commit '${{ github.sha }}' -AsService
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: flow-windows-service-check
          path: |
            service-test-state/service-test.json
            service-test-state/recovery-display.txt
            service-test-state/recovery-policy.json
            service-test-state/flow.log
            interface-guard-check/report.json
            update-test-state/report.json
            service-update-test-state/report.json
            service-update-test-state/state/flow.log
            request-cancel/**/report.json
            request-cancel/report.json
            request-cancel/**/server-output.log

  # Development master images retain their separate channel. Release images
  # publish only from ts_release.yml after every native/package gate passes.
  docker:
    needs: [cross, native-streaming-tests, linux-validation, controlled-evidence, high-bitrate-comparison, windows-service, native-profiling, release-inventory, windows-network-notifications]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.release_channel != 'stable' && inputs.release_channel != 'preview'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      release_channel: development
