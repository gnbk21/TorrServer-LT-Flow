name: Build and Release
on:
  push:
    tags: ['MatriX.145.Flow-*']
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      validation_scope: ${{ steps.scope.outputs.validation_scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          FLOW_TAG: ${{ github.ref_name }}
        run: |
          channel=$(python3 build/release.py --classify --tag "$FLOW_TAG")
          if [ "$channel" = stable ]; then
            git merge-base --is-ancestor HEAD origin/master
            python3 -c 'import json; a=json.load(open("RELEASE_ACCEPTANCE.json")); assert a["stable_approved"] is True and a["evidence"] and not a["remaining"], "Stable acceptance is incomplete"'
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - id: scope
        name: Verify evidence before selecting essential patch checks
        env:
          FLOW_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=full
          if [ "$FLOW_TAG" = MatriX.145.Flow-v1.1.4 ]; then
            python3 build/essential_release.py d482e8c06d0e7cce7575f5300f30cfc70290153b
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/39761266311" --jq '[.head_sha,.conclusion] | @tsv' > accepted-runtime-check.txt
            python3 -c 'from pathlib import Path; assert Path("accepted-runtime-check.txt").read_text().strip()=="d482e8c06d0e7cce7575f5300f30cfc70290153b\tsuccess", "Accepted full validation is not successful"'
            scope=essential
            echo "validation_scope=$scope" >> "$GITHUB_OUTPUT"
            echo "web_run_id=39761266311" >> "$GITHUB_OUTPUT"
          else
            python3 build/essential_release.py --release-tag "$FLOW_TAG" --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Reuse source-identical fully validated embedded UI
        if: steps.scope.outputs.validation_scope == 'essential'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-web-cross
          run-id: ${{ steps.scope.outputs.web_run_id }}
          github-token: ${{ github.token }}
          path: server/web/pages/template
      - name: Make validated UI available in this run
        if: steps.scope.outputs.validation_scope == 'essential'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-web-cross
          path: server/web/pages/template
          retention-days: 14
          if-no-files-found: error
      - run: python3 -m unittest discover -s build -p '*_test.py'
      - name: Verify installer channel selection
        shell: pwsh
        run: |
          ./build/test-release-channels.ps1
          ./build/test-update-state.ps1
  web:
    needs: classify
    uses: ./.github/workflows/build-web.yml
    with:
      artifact-name: flow-web-cross
      reuse-artifact: ${{ needs.classify.outputs.validation_scope == 'essential' && 'flow-web-cross' || '' }}
  cross:
    needs: [classify, web]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      web_artifact: flow-web-cross
      validation_scope: ${{ needs.classify.outputs.validation_scope }}
      release_channel: ${{ needs.classify.outputs.channel }}
  macos:
    needs: [classify, web]
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ github.ref_name }}
      web_artifact: flow-web-cross
  release:
    needs: [classify, cross, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require actual successful release jobs before packaging
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_SCOPE: ${{ needs.classify.outputs.validation_scope }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > verified-jobs.json
          python3 build/release_gates.py verified-jobs.json --scope "$FLOW_SCOPE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - working-directory: web
        run: yarn install --frozen-lockfile
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: TorrServer-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flow-runtime-notices-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-interface-guard-windows
          path: artifacts/interface-guard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-web-cross
          path: server/web/pages/template
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1
      - run: bash build/_fetch_sources.sh
      - working-directory: server
        run: go mod download
      - name: Verify identity and package binaries
        env:
          FLOW_TAG: ${{ github.ref_name }}
          FLOW_COMMIT: ${{ github.sha }}
        run: python3 build/release.py --tag "$FLOW_TAG" --commit "$FLOW_COMMIT" --artifacts artifacts --native-sources _src --output dist
      - name: Verify reproducible packaging
        env:
          FLOW_TAG: ${{ github.ref_name }}
          FLOW_COMMIT: ${{ github.sha }}
        run: |
          python3 build/release.py --tag "$FLOW_TAG" --commit "$FLOW_COMMIT" --artifacts artifacts --native-sources _src --output reproducibility-check
          cmp dist/SHA256SUMS reproducibility-check/SHA256SUMS
      - name: Validate exact packaged CycloneDX inventory
        run: node build/validate_sbom.cjs dist/SBOM.cdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish channel-aware release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.classify.outputs.channel == 'preview' }}
          make_latest: ${{ needs.classify.outputs.channel == 'stable' }}
          name: ${{ github.ref_name == 'MatriX.145.Flow-v1.1.5' && 'TorrServer-Flow 1.1.5' || github.ref_name == 'MatriX.145.Flow-v1.1.4' && 'TorrServer-Flow 1.1.4' || github.ref_name }}
          generate_release_notes: true
          body_path: ${{ github.ref_name == 'MatriX.145.Flow-v1.1.5' && 'RELEASE_1_1_5_NOTES.md' || github.ref_name == 'MatriX.145.Flow-v1.1.4' && 'RELEASE_1_1_4_NOTES.md' || github.ref_name == 'MatriX.145.Flow-v1.1.3' && 'RELEASE_1_1_NOTES.md' || github.ref_name == 'MatriX.145.Flow-v1.0.1' && 'RELEASE_1_0_NOTES.md' || github.ref_name == 'MatriX.145.Flow-v0.2.0-preview.7' && 'PREVIEW_2_7_NOTES.md' || github.ref_name == 'MatriX.145.Flow-v0.2.0-preview.5' && 'PREVIEW_2_NOTES.md' || 'DISTRIBUTION.md' }}
  docker:
    needs: [classify, release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      release_channel: ${{ needs.classify.outputs.channel }}
