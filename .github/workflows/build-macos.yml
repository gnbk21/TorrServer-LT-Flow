name: build-macos

# Each target uses a supported native host. Keeping Intel and ARM pools
# separate avoids one architecture's queue starving both release artifacts.
# libtorrent is built from the PINNED source tag via build/darwin-native.sh —
# the same b2 engine every cross target uses — NOT taken from Homebrew: brew's
# libtorrent floats and would silently change what a release links against
# (and it lacks the internal symbols the shim needs, TSL_HAVE_LT_INTERNALS).
# The pin lives in build/_common.sh (currently v2.1.2 + static OpenSSL for
# webtorrent/https).

on:
  # No `push` trigger: the macOS build does NOT run on every push to master.
  # Build manually (workflow_dispatch) or via a release tag, which reuses this
  # workflow through ts_release.yml's workflow_call.
  pull_request:
    branches: [master, develop]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  # Reused by ts_release.yml on a tag; `version` stamps the binaries.
  workflow_call:
    inputs:
      web_artifact:
        description: 'Validated embedded UI artifact from this same workflow run'
        type: string
        default: ''
      version:
        type: string
        default: ''

concurrency:
  group: october-${{ github.workflow }}-build-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  web:
    uses: ./.github/workflows/build-web.yml
    with:
      artifact-name: flow-web-macos
      reuse-artifact: ${{ inputs.web_artifact }}

  macos:
    needs: web
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    name: macos/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: TorrServer-LT-darwin-arm64
          - arch: amd64
            runner: macos-15-intel
            artifact: TorrServer-LT-darwin-amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download freshly generated web UI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.web_artifact || 'flow-web-macos' }}
          path: server/web/pages/template

      # Same _src cache key as build.yml, so the Boost+libtorrent sources
      # fetched by the linux matrix are reused here (the cache is not
      # OS-partitioned — it is a plain tar of the source trees).
      - name: Cache Boost + libtorrent sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.2-ossl3.5.7-v1

      # Per-arch install tree (lib + headers + .pc). With it present the b2
      # step short-circuits and only the Go binaries are relinked.
      - name: Cache libtorrent install tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _deps/darwin-${{ matrix.arch }}
          key: deps-${{ matrix.runner }}-${{ runner.arch }}-darwin-${{ matrix.arch }}-boost1.85.0-lt2.1.2-ossl3.5.7-flowsparse-pcfold2-${{ hashFiles('build/native-patches/**', 'build/apply_native_patches.py', 'build/patch_libtorrent_header.py') }}
          restore-keys: deps-${{ matrix.runner }}-${{ runner.arch }}-darwin-${{ matrix.arch }}-boost1.85.0-lt2.1.2-ossl3.5.7-

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Fetch sources
        run: bash build/_fetch_sources.sh

      # Builds pinned libtorrent via b2 (cached after the first run), then the
      # base binary AND the -gst variant (see build/_deps.sh go_build).
      - name: Build
        env:
          TS_VERSION: ${{ inputs.version || format('MatriX.145.Flow-dev-{0}', github.sha) }}
        run: bash build/darwin-native.sh ${{ matrix.arch }}

      # Native arm64 only: running x86_64 cgo tests under Rosetta is slow, and
      # the build.yml linux-amd64 job already gates the test suite.
      - name: Run unit tests
        if: matrix.arch == 'arm64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          CGO_CXXFLAGS: -DTSL_HAVE_LT_INTERNALS
          FLOW_REQUIRE_CACHE_EXTENSION: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/darwin-arm64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/darwin-arm64/lib/pkgconfig
          CGO_LDFLAGS: "-L${{ github.workspace }}/_deps/darwin-arm64/lib -framework SystemConfiguration -framework CoreFoundation"
        run: go test -count=1 -timeout 180s ./flow/ ./ffprobe/ ./lt/ ./torr/ ./torr/storage/torrstor/ ./dlna/ ./web/sslcerts/ ./torr/utils/

      # Both version probes execute on their native architecture.
      - name: Probe --version
        run: |
          _out/${{ matrix.artifact }} --version
          _out/${{ matrix.artifact }}-gst --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: ${{ matrix.artifact }}
          path: _out/${{ matrix.artifact }}*
          if-no-files-found: error
