name: Build embedded web UI

on:
  workflow_call:
    inputs:
      reuse-artifact:
        description: 'Previously validated embedded UI from this same run; download only'
        type: string
        default: ''
      artifact-name:
        required: true
        type: string

concurrency:
  group: october-${{ github.workflow }}-build-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLOW_WEB_BUILD: ${{ inputs.reuse-artifact == '' && (github.event_name != 'pull_request' || inputs.artifact-name == 'flow-web-pr') && '1' || '0' }}
      FLOW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      FLOW_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download validated same-run web UI
        if: inputs.reuse-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.reuse-artifact }}
          path: server/web/pages/template
      - name: Resolve the validated web build for this PR source
        id: shared
        if: github.event_name == 'pull_request' && inputs.reuse-artifact == '' && inputs.artifact-name != 'flow-web-pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/shared_web.py resolve
      - name: Download shared PR web artifact
        if: steps.shared.outputs.run-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flow-web-pr
          path: server/web/pages/template
          run-id: ${{ steps.shared.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify repository, PR, head and merge-source identity
        if: github.event_name == 'pull_request' && env.FLOW_WEB_BUILD != '1'
        run: python3 build/shared_web.py verify
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.FLOW_WEB_BUILD == '1'
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: env.FLOW_WEB_BUILD == '1'
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Install web dependencies
        if: env.FLOW_WEB_BUILD == '1'
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: Validate Flow web UI
        if: env.FLOW_WEB_BUILD == '1'
        working-directory: web
        run: |
          yarn typecheck
          yarn lint
          yarn test
          yarn build
      - name: Bound hosted-runner package downloads
        if: env.FLOW_WEB_BUILD == '1'
        run: bash build/ci-apt.sh
      - name: Cache pinned Playwright browser
        if: env.FLOW_WEB_BUILD == '1'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/yarn.lock') }}
      - name: Install browser runtime
        if: env.FLOW_WEB_BUILD == '1'
        timeout-minutes: 10
        working-directory: web
        run: yarn playwright install --with-deps chromium
      - name: Browser regressions
        if: env.FLOW_WEB_BUILD == '1'
        timeout-minutes: 10
        working-directory: web
        run: yarn test:e2e
      - name: Production interface lab
        if: env.FLOW_WEB_BUILD == '1'
        working-directory: web
        run: yarn test:lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.FLOW_WEB_BUILD == '1'
        with:
          retention-days: 14
          name: ${{ inputs.artifact-name }}-interface-evidence
          path: |
            web/lab-results/**/measurement.json
            web/test-results/**/library-measurement.json
            web/test-results/**/*.png
          if-no-files-found: warn
      - name: Generate embedded assets
        if: env.FLOW_WEB_BUILD == '1'
        run: |
          go test gen_web.go gen_web_test.go
          go run gen_web.go
      - name: Bind embedded web artifact to its triggering source
        if: env.FLOW_WEB_BUILD == '1'
        run: python3 build/shared_web.py write
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.reuse-artifact == ''
        with:
          retention-days: 14
          name: ${{ inputs.artifact-name }}
          path: server/web/pages/template
          if-no-files-found: error
