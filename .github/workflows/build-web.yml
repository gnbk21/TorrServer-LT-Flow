name: Build embedded web UI

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Install web dependencies
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: Validate Flow web UI
        working-directory: web
        run: |
          yarn typecheck
          yarn lint
          yarn test
          yarn build
      - name: Bound hosted-runner package downloads
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99flow-ci-timeouts >/dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#https\?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install browser runtime
        timeout-minutes: 10
        working-directory: web
        run: yarn playwright install --with-deps chromium
      - name: Browser regressions
        timeout-minutes: 10
        working-directory: web
        run: yarn test:e2e
      - name: Production interface lab
        working-directory: web
        run: yarn test:lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ inputs.artifact-name }}-interface-evidence
          path: |
            web/lab-results/**/measurement.json
            web/test-results/**/library-measurement.json
            web/test-results/**/*.png
          if-no-files-found: warn
      - name: Generate embedded assets
        run: |
          go test gen_web.go gen_web_test.go
          go run gen_web.go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: server/web/pages/template
          if-no-files-found: error
