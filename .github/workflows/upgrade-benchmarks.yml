name: Flow upgrade matched measurements
on:
  workflow_call:
    inputs:
      candidate_run_id:
        required: true
        type: string
      comparison:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Build run containing the exact checked-out candidate binary'
        required: true
        type: string
      comparison:
        description: 'Measure stable profiles, candidate transport sizes, or opt-in experiments separately'
        type: choice
        options: [profiles, transport, experiments, endurance]
        default: profiles
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: inputs.comparison != 'endurance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [healthy, outages, mixed-peers, bursts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable candidate build identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          actual=$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
          # PR checkouts use the reviewed merge commit; headSha identifies the
          # source branch and github.sha stamps the candidate build metadata.
          [[ "$actual" == "${{ github.event.pull_request.head.sha || github.sha }}" ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TorrServer-LT-linux-amd64
          path: _out/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the pinned published stable baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA256: f234d9d6934543480b41f4f11810499dc66bd5d7d8a7540b28416eceba7371c2
        run: |
          mkdir -p _out/stable
          gh release download MatriX.148.Flow-v1.2.0 --repo "$GITHUB_REPOSITORY" --dir _out/stable --pattern TorrServer-LT-linux-amd64 --pattern SHA256SUMS --pattern BUILDINFO.json
          (cd _out/stable && sha256sum --check --ignore-missing SHA256SUMS)
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path("_out/stable/TorrServer-LT-linux-amd64"); assert hashlib.file_digest(p.open("rb"),"sha256").hexdigest()==os.environ["BASELINE_SHA256"], "Stable baseline digest mismatch"'
          gh attestation verify _out/stable/TorrServer-LT-linux-amd64 --repo "$GITHUB_REPOSITORY" --source-digest aaf2bc583d196d376751dccf265242273eaad89d --source-ref refs/tags/MatriX.148.Flow-v1.2.0 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ts_release.yml" --deny-self-hosted-runners
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata=json.loads(Path('_out/stable/BUILDINFO.json').read_text())
          assert metadata['source_commit']=='aaf2bc583d196d376751dccf265242273eaad89d'
          assert metadata['version']=='MatriX.148.Flow-v1.2.0'
          PY
      - name: Five rotated original-byte comparisons
        env:
          MODE: ${{ inputs.comparison }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          chmod +x _out/candidate/TorrServer-LT-linux-amd64 _out/stable/TorrServer-LT-linux-amd64
          bash build/ci-apt.sh ffmpeg
          options=()
          case "$MODE" in
            profiles) options+=(--baseline _out/stable/TorrServer-LT-linux-amd64) ;;
            transport) options+=(--transport-comparison) ;;
            experiments) options+=(--experiments) ;;
          esac
          python3 build/high_bitrate_matrix.py --executable _out/candidate/TorrServer-LT-linux-amd64 --output _out/measurements --mbps 120 --seconds 60 --rotations 5 --cases "$SCENARIO" "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: upgrade-${{ inputs.comparison }}-${{ matrix.scenario }}
          path: |
            _out/measurements/**/report.json
            _out/measurements/**/server-output.log
          if-no-files-found: error

  endurance:
    if: inputs.comparison == 'endurance'
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: [ram, disk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable candidate build identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          actual=$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
          [[ "$actual" == "${{ github.event.pull_request.head.sha || github.sha }}" ]]
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TorrServer-LT-windows-amd64
          path: _out/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Two uninterrupted hours of byte-checked seek and idle cycles
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          options=()
          if [[ "$BACKEND" == disk ]]; then options+=(--disk); fi
          python build/resource_endurance.py --executable _out/candidate/TorrServer-LT-windows-amd64.exe --output _out/endurance --hours 2 --interval 15 "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: upgrade-endurance-${{ matrix.backend }}
          path: |
            _out/endurance/report.json
            _out/endurance/state/server-output.log
          if-no-files-found: error
